# PROPOSED. Identifier /req/executor-run is the Architect's proposal; none is assigned.
# What an executor does while a run is in progress (decision 2026-11-13: the executor is divided into a start class and a run class).
# Inherits /req/core directly because ogcspec.gate.toml sets core_dependency = "direct" (M012), and /req/executor-start because a run begins only after the start checks.
# First half: moving between states. Second half: invariants, endings, halting and clean-up.
