kind: requirement
id: /req/executor-run/composite-no-observation
status: proposed
statement: An executor SHALL treat a condition that reads a record or an array as reading no observation when any field of the record, or any element of the array, has no usable value, except that /req/executor-run/data-error applies when the field is one the result schema does not mark optional and the value omits it or sets it to null.
