kind: abstract_test
id: /conf/binding-json/specification
status: proposed
target: /req/binding-json/specification
purpose: Verify that a capability binding states the capability specification it applies to in the top-level member named `specification`.
steps:
  - Locate the top-level member named `specification` of the capability binding.
  - Check that the member is present.
  - Check that its value is an object.
  - Check that the object has members named `href`, `uniqueId` and `version`.
