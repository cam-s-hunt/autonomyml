kind: abstract_test
id: /conf/binding-json/data-streams
status: proposed
target: /req/binding-json/data-streams
purpose: Verify that a capability binding states the mapping of datastreams in the top-level member named `dataStreams`.
steps:
  - Locate the top-level member named `dataStreams` of the capability binding.
  - Check that its value is an object.
  - Check that the members of the object are named with the local names of the datastreams that the capability specification declares.
  - Check that the value of each member is a URI as defined by RFC 3986.
  - Check that the URI is that of a datastream.
