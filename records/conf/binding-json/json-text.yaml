kind: abstract_test
id: /conf/binding-json/json-text
status: proposed
target: /req/binding-json/json-text
purpose: Verify that a capability binding is a JSON text, as defined by RFC 8259, whose top-level value is an object.
steps:
  - Parse the capability binding as a JSON text as defined by RFC 8259.
  - Check that it parses without error.
  - Check that the top-level value is an object.
