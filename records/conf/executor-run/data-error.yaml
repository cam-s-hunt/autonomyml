kind: abstract_test
id: /conf/executor-run/data-error
status: proposed
target: /req/executor-run/data-error
purpose: Verify that an executor cleans up and ends the run with the ending fail when a condition reads a field that the schema does not mark optional and the value omits or nulls it.
steps:
  - Use a capability specification with a condition that reads a field of a record result that the result schema does not mark optional, and with exit actions in the states the run will be in.
  - Start a run and bring it to a state in which the condition is evaluated.
  - Supply a result that omits the field.
  - Check that the executor performs the exit actions of the states it is in, innermost first.
  - Check that the run then ends with the ending fail.
  - Repeat with a result that sets the field to null.
  - Repeat with a result that omits a field the result schema marks optional, and check that the executor does not end the run under this rule.
  - Repeat with a result that omits a required field that no condition reads, and check that the executor does not end the run under this rule.
