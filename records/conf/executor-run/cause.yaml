kind: abstract_test
id: /conf/executor-run/cause
status: proposed
target: /req/executor-run/cause
purpose: Verify that a run that ends in a terminal state records that state's name as its cause.
steps:
  - Use a capability specification with a terminal state.
  - Cause a run to enter the terminal state.
  - Read the record of the run.
  - Check that its cause is the name of that terminal state.
