kind: abstract_test
id: /conf/executor-run/end-halted
status: proposed
target: /req/executor-run/end-halted
purpose: Verify that the command of a halted run keeps the status CANCELED and that the executor reports no other status code for it.
steps:
  - Start a run.
  - Cancel the run's command.
  - Wait for the run to end.
  - Read the status reports of the run's command.
  - Check that the status code of the command is CANCELED.
  - Check that the executor has reported no status report with another status code after the cancel.
