kind: abstract_test
id: /conf/executor-run/result-schema
status: proposed
target: /req/executor-run/result-schema
purpose: Verify that the result schema of the executor's run control stream is a DataRecord with the fields cause and failedCleanUp.
steps:
  - Identify the control stream on which the executor accepts run requests.
  - Retrieve its result schema.
  - Check that the schema is a DataRecord.
  - Check that it has a field named `cause` of type Text.
  - Check that it has a field named `failedCleanUp` that is a DataArray whose elements are Text.
