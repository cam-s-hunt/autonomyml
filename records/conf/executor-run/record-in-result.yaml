kind: abstract_test
id: /conf/executor-run/record-in-result
status: proposed
target: /req/executor-run/record-in-result
purpose: Verify that an executor creates a CommandResult that states the cause and the failed clean-up actions when a run ends.
steps:
  - Complete a run by reaching a terminal state, another by a halt with a failing exit action, and another by an action failure.
  - For each, read the CommandResult resources of the run's command.
  - Check that a CommandResult has a field `cause` that is the cause of the run.
  - Check that the CommandResult has a field `failedCleanUp` that lists the names of the failed clean-up actions, and is empty when none failed.
