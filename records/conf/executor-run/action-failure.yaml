kind: abstract_test
id: /conf/executor-run/action-failure
status: proposed
target: /req/executor-run/action-failure
purpose: Verify that an executor cleans up and ends the run with the ending fail when an action fails.
steps:
  - Use a capability specification with a state whose action will fail.
  - Start a run and bring it to that state.
  - Cause the action to fail.
  - Check that the executor performs the exit actions of the states it is in, innermost first.
  - Check that the run then ends with the ending fail.
