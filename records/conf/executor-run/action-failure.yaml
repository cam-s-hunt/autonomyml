kind: abstract_test
id: /conf/executor-run/action-failure
status: proposed
target: /req/executor-run/action-failure
purpose: Verify that an executor cleans up and ends the run with the ending fail when the command of an action is rejected, fails, is cancelled by another party, or cannot be sent.
steps:
  - Use a capability specification with an entry action whose command will be rejected.
  - Start a run and bring it to the state with that action.
  - Check that the executor performs the exit actions of the states it is in, innermost first.
  - Check that the run then ends with the ending fail.
  - Repeat with a command that fails, with a command that cannot be sent, and with an exit action.
  - Repeat with a command that is cancelled directly on its control stream by a party other than the executor.
  - Check that the executor cleans up and ends the run with the ending fail.
  - Cause the executor to cancel an entry-action command itself by leaving the state, and check that this is not treated as a failure.
  - Repeat once with the run's command cancelled while the exit actions are in progress, and check that the run then ends as halted and not with the ending fail (see the test of /req/executor-run/halt-in-clean-up).
