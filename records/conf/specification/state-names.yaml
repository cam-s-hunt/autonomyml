kind: abstract_test
id: /conf/specification/state-names
status: proposed
target: /req/specification/state-names
purpose: Verify that no two states, invariants, actions or postconditions of a capability specification have the same name.
steps:
  - Collect the name of every state, invariant, action and postcondition of the capability specification, including states nested in modes.
  - Check that no name occurs more than once.
