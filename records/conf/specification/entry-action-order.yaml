kind: abstract_test
id: /conf/specification/entry-action-order
status: proposed
target: /req/specification/entry-action-order
purpose: Verify that a capability specification states the entry actions of a state in an order.
steps:
  - Identify each state that has entry actions.
  - For each, check that the specification gives an order for them, which is the order in which they are to be performed.
