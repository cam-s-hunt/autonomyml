kind: abstract_test
id: /conf/executor-start/size-limit
status: proposed
target: /req/executor-start/size-limit
purpose: Verify that an executor rejects a run request when a bound array or matrix is declared larger than the specification allows.
steps:
  - Prepare a capability specification that declares a maximum size for an array field.
  - Prepare a binding to a data stream whose result schema declares a larger element count for that field.
  - Send a run request that names them and check that the executor rejects it.
