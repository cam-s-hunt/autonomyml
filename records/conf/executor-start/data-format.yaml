kind: abstract_test
id: /conf/executor-start/data-format
status: proposed
target: /req/executor-start/data-format
purpose: Verify that an executor takes the result schema and the observations of a bound data stream in the media type application/json, and rejects a run request when a bound data stream does not offer that media type.
steps:
  - Prepare a capability specification and a binding to a data stream that offers its schema and observations in application/json.
  - Send a run request that names them, and check from the requests the executor makes that it asks for the schema resource of the data stream with the media type application/json and reads observations of the data stream in application/json.
  - Repeat with a data stream whose schema resource is offered only in another media type, for example application/swe+json, and check from the `formats` of the data stream that application/json is not offered, and that the executor rejects the request.
