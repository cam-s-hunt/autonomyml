kind: abstract_test
id: /conf/specification-json/action-stream
status: proposed
target: /req/specification-json/action-stream
purpose: Verify that each action states its control stream in a member named `controlStream`.
steps:
  - Identify each entry action and each exit action.
  - For each, locate its member named `controlStream`.
  - Check that its value is a string.
  - Check that the string is the local name of a declared control stream.
