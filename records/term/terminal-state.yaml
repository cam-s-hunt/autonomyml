kind: term
id: /term/terminal-state
status: proposed
term: terminal state
definition: state in which a run of a state machine ends, and from which no transition leaves.
note: 'NOTE 1  A terminal state has one ending: succeed or fail.

  NOTE 2  A halted run ends in no terminal state of the document.

  NOTE 3  Whether a halted or failed run may be restarted is not defined here.'
